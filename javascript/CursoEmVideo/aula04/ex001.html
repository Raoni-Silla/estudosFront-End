<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Primeiro Exercicio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        background-color: aqua;
        display: flex;
        width: 50%;
        height: 50vh;
        justify-content: space-around;
        align-items: center;
        margin: auto;
        padding: 40px;
        border-radius: 30px;
        margin-top: 10%;
        color: white;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        flex-wrap: wrap;
      }

      .container p {
        min-width: 20%;
        max-width: 30%;
        text-align: justify;
        font-size: 1.2em;
        text-shadow: 1px 1px 4px black;
      }
      body {
        background-color: rgba(0, 0, 0, 0.875);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello World</h1>
      <p>
        Lorem, ipsum dolor sit amet consectetur adipisicing elit. Blanditiis,
        asperiores labore? Rerum sequi deserunt laboriosam. Tempora perferendis
        delectus facere similique corporis, autem dolorem animi distinctio
        laboriosam! Rerum dolore illum et.
      </p>
    </div>
    <script>
      window.alert("minha primeira mensagem"); /* aparecer um aviso na tela */
      let nome = window.prompt("qual seu nome?"); //input (cin)
      window.alert("seja bem vindo " + nome);

      /* let serve pra armazenar dados que podem mudar, js possue uma tipagem dinamica */
      /* const são pra valores de variaveis que não podem mudar */
    </script>
  </body>
</html>
