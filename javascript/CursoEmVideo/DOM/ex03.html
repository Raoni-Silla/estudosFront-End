<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Somando valores </h1>
    <input type="number" name="n1" id="n1"> +
    <input type="number" name="n2" id="n2">
    <input type="button" value="somar" id="somar">

    <div id="res"> resultado </div>

    <script>
       document.getElementById('somar').addEventListener('click', somar)

       function somar(){

        let n1 = document.getElementById('n1')
        let n2 = document.querySelector('input#n2')
        let resultado = document.querySelector('div#res')

        let numeroConvertido1 = Number(n1.value)
        let numeroConvertido2 = Number(n2.value)

        let soma = numeroConvertido1 + numeroConvertido2

        resultado.innerHTML = `A soma entre ${numeroConvertido1} e ${numeroConvertido2} é ${soma}`

       }
    </script>
</body>
</html>
