<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculadora de idade</title>
  </head>
  <body>
    <header>
      <h1 class="tituloPrincipal">Calculadora de idade</h1>
    </header>

    <section id="section">
      <div id="form">
        <label for="ano">Ano de Nascimento:</label>
        <input type="number" placeholder="digite o ano" name="ano" id="ano" />

        <p>Gênero:</p>

        <div class="radio-group">
          <input type="radio" id="mas" name="sexo" value="m" />
          <label for="mas">Masculino</label>
        </div>

        <div class="radio-group">
          <input type="radio" id="fem" name="sexo" value="f" />
          <label for="fem">Feminino</label>
        </div>

        <input type="button" value="calcular" id="calcular" />
      </div>

      <div id="foto">
        <img src="" alt="foto" id="img" />
        <p id="resposta">descrição</p>
      </div>
    </section>

    <footer>
      <p>@Curso em video</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
